; Total Annihilation v2026.8.6 advanced settings

; Original windowed mode will disable many TA patch features (including some of these) and is not recommended
; You can use cnc-ddraw for windowed mode instead: https://github.com/FunkyFr3sh/cnc-ddraw/releases

[Preferences] 
; custom settings, if any entry is disabled the "TA patch default" values will be used

; Create DirectDraw surfaces in video memory rather than system memory
; Change the following setting if your game is not running smoothly
; This setting is ignored if you are using cnc-ddraw
; TA v2026.6.17 default is TRUE
UseVideoMemory = TRUE; 

; Override your "DisplayModeHeight" registry setting if lower than 768
; If "DisplayModeWidth" is below 1024 it will override it as well
; Resolutions shown in the in-game list (EnumDisplayModes) are only filtered by height (768 minimum), any width is allowed still if supported by your hardware
; TA patch default is FALSE
DisplayModeMinHeight768 = TRUE;

; Megamap FPS Limit
; Supports the following values: 0-1000
; 0 = no limit
; TA patch  default is 60
MegamapFPSLimit = 60;

; Unit limit per player
; Set from 20 - 1500
; TA v3.1 default is 250
; TA patch default is 1500
UnitLimit = 1500;

; Pathfinding cycles
; Setting too low (such as TA v3.1 default) ruins pathfinding but setting extremely high lowers fps
; TA v3.1 default is 1333
; TA patch default is 66650
AISearchMapEntries = 66650;

; Special effects limit (smoke, etc.)
; Setting too low (such as TA v3.1 default) will degrade visual quality
; This setting is still experimental, if you experience visual issues set to 400
; TA v3.1 default is 400
; TA patch default is 20480
SfxLimit = 20480;

; Unit model size limit
; Set max width and height for unit model drawing buffer
; TA v3.1 default is 600x600
; TTA patch default is 1280x1280
X_CompositeBuf = 1280;
Y_CompositeBuf = 1280;

; Unit ID limit
; Set the maximum number of unique unit IDs
; TA v3.1 default is 512
; TA patch default is 16000
UnitType = 16000;

; Weapon ID limit
; Set the maximum number of unique weapon IDs
; TA v3.1 default is 256
; TTA patch default is 16000
WeaponType = 16000;

; Weapon ID multiplayer patch
; Set to TRUE to enable increased Weapon ID limit in multiplayer
; Set to FALSE to allow increased Weapon ID limit only in single player
; TA v3.1 default is FALSE
; TA patch default is FALSE (Weapon ID limit increase not yet compatible with Replayer)
MultiGameWeapon = FALSE;

; Double-click selection
; Enable or disable the new "double-click to select all units of the same type on screen" feature
; TA v3.1 default is FALSE
; TA patch default is TRUE
DoubleClick = TRUE;

; Expanded Multiplayer Sharing Menu
; Enable or disable the new expanded multiplayer sharing menu
; TA v3.1 default is FALSE
; TA patch default is TRUE
ShareDialogExpand = TRUE;

; Main menu resolution adjuster
; Set to FALSE to keep main menu resolution at the default 640x480
; Set to TRUE to match main menu resolution to the in-game resolution set via options menu
; If TRUE, the main menu will not be upscaled to fit increased output resolution
; If resolution is not valid, the game will not start (use resolution overrider below to fix)
; Note: This setting is ignored if you are using cnc-ddraw
; TA v3.1 default is FALSE
; TA patch default is FALSE
MenuResolution = FALSE;

; Megamap
; Enable or disable the new megamap
; TA v3.1 default is FALSE
; TA patch default is TRUE
FullScreenMinimap = TRUE;

; Preserve enhanced minimap colours in TA's built-in 126x126 minimap.
; Re-renders the stored TNT minimap at its final display size so TA's normal
; 2x downscale does not collapse colour dithering back to brown.
EnhancedBuiltInMinimap = TRUE;

; Dither the megamap and the built-in minimap
; TA's palette has no mid-luminance desaturated greens, so downscaled terrain
; colours are reproduced by dithering two palette entries against each other
; Set to FALSE to snap each pixel to its nearest palette colour instead:
; flatter and free of stipple, but grass and similar mixed terrain go brown
; Takes effect at the next map load
; TA patch default is TRUE
MegamapDither = TRUE;

; Nanoframe Build Preview
; Style of the placement preview shown under the build cursor:
;   WIREFRAME - a shimmering wireframe of the structure plus a scanline
;               sweeping through it
;   FULL      - as WIREFRAME, but the model is also filled in with the
;               shimmering nanoframe shading, for a preview that looks like
;               the nanoframe the building starts out as
;   DISABLED  - no preview at all, just TA's plain build rectangle
; Takes effect at the next TA start
; TA patch default is WIREFRAME
; (supersedes the old TRUE/FALSE "NanoframePreviewFill", which is still read
; when this setting is absent)
NanoframePreview = WIREFRAME;

; Team-Colored Nanolathe Effects
; Recolors nanolathe particle streams, structures under construction, and
; nanoframe build previews to match each player's team color.
; Set to FALSE to preserve TA's stock green nanolathe effects.
; StreamColors accepts 1 to 15 decimal palette indices from 0 to 255.
; FrameColors requires exactly 16 ordered decimal palette indices.
; The defaults below are designed for stock PALETTE.PAL. Mods using a custom
; palette can replace any player list; invalid lists use the stock defaults.
; Takes effect at the next TA start.
; TA patch default is FALSE
TeamColorNanolathe = FALSE;

