; Unit Model Zero-Shade Fallback
; Prevents valid model faces from becoming completely black when TA calculates
; shade level zero. Set to 0 to disable the fix and preserve stock behaviour.
; Values range from 1 (darkest) to 31 (brightest).
; Custom PALETTE.SHD files can produce different brightness at the same level.
; TA patch default is 5
ShadingZeroFallbackLevel = 5;

; Unit Status Counters
; Show stocked/queued missile counts and loaded transport capacity above health bars
; These counters are only visible while TA's health bars are enabled
; Counter and group number colors use TA palette indexes from 0 to 255
; Takes effect at the next TA start
ShowStockpileCounter = TRUE;
ShowTransportCounter = TRUE;
StockpileCounterColor = 255;
TransportCounterColor = 255;
GroupNumberColor = 255;

; Megamap Icon Configuration File
; Set the location of the megamap's icon configuration file
; TA patch default is .\Icon\iconcfg.ini
MegaMapConfig = .\Icon\iconcfg.ini;

; Megamap Configuration Settings
; Use the fields below to customize the megamap

; Megamap Mouse Wheel Zooming
; Enable or disable ability to zoom in and out of the megamap with the mouse wheel
; TA patch default is TRUE
WheelZoom = TRUE;

; Megamap Mouse Wheel Zoom In Mode
; Set to TRUE to zoom to the cursor location when rolling the wheel up from the megamap
; Set to FALSE to zoom to the previous camera location when rolling the wheel up from the megamap
; TA patch default is TRUE
WheelMoveMegaMap = TRUE;

; Megamap Double-Click to Zoom Option
; Enable or disable the option to zoom to the cursor location...
; ...when double-clicking terrain on the megamap
; TA patch default is FALSE
DoubleClickMoveMegamap = FALSE;

; Megamap Unit Icon Flashing When Under Attack
; Enable or disable megamap unit icon flashing when under attack
UnderAttackFlash=TRUE;

