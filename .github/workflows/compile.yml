name: Build and Release tdraw.dll

on:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    #
    # MASTER → prerelease ("latest")
    #

    - name: Create prerelease
      uses: marvinpinto/action-automatic-releases@latest
      if: github.ref == 'refs/heads/master'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: true
        title: "Development Build"

    #
    # TAGS → real releases
    #

    - name: Create release
      uses: marvinpinto/action-automatic-releases@latest
      if: startsWith(github.ref, 'refs/tags/')
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false

  build-tdraw:
    runs-on: windows-latest
    needs: create-release

    permissions:
      contents: write

    strategy:
      matrix:
        config:
          - name: prota
            define: TDRAW_CONFIG_PROTA
          - name: escalation
            define: TDRAW_CONFIG_ESCALATION
          - name: ota
            define: TDRAW_CONFIG_OTA
          - name: tazero
            define: TDRAW_CONFIG_TAZERO
          - name: bta
            define: TDRAW_CONFIG_BTA

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_x86

    - name: Build tdraw.dll (${{ matrix.config.name }})
      run: |
        msbuild src/DDraw/ddraw.vcxproj /p:Configuration=ReleasePublic /p:Platform=x86 /p:TDRAW_CONFIG=${{ matrix.config.define }}

    # The runner's MSVC toolset drifts independently of this repo, and newer ones
    # statically import Win8+ APIs (GetSystemTimePreciseAsFileTime) that stop the
    # DLL loading at all on the Windows 7 rigs some players still use.  Check the
    # artifact rather than trusting the compiler settings.
    - name: Verify Windows 7 compatibility (${{ matrix.config.name }})
      run: |
        python src/DDraw/tools/check_win7_imports.py src/DDraw/Public/tdraw.dll

    - name: Create archive (${{ matrix.config.name }})
      run: |
        Compress-Archive -Path src\DDraw\Public\tdraw.dll,src\DDraw\totala.ini,src\DDraw\tdraw.txt,LICENSE -Destination src\DDraw\Public\tdraw-${{ matrix.config.name }}.zip

    - name: Upload prerelease asset (${{ matrix.config.name }})
      if: github.ref == 'refs/heads/master'
      shell: pwsh
      run: |
        gh release upload latest src/DDraw/Public/tdraw-${{ matrix.config.name }}.zip --clobber
        if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release asset (${{ matrix.config.name }})
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        gh release upload "${{ github.ref_name }}" src/DDraw/Public/tdraw-${{ matrix.config.name }}.zip --clobber
        if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-recorder:
    runs-on: windows-latest
    needs: create-release

    permissions:
      contents: write

    strategy:
      matrix:
        config:
          - name: ota
            dll: tplayx.dll
          - name: prota
            dll: tplayx.dll
          - name: escalation
            dll: eplayx.dll
          - name: twilight
            dll: tplayx.dll
          - name: mayhem
            dll: tplayx.dll
          - name: tazero
            dll: zplayx.dll
          - name: bta
            dll: bplayx.dll

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify committed build exists (${{ matrix.config.name }})
      shell: pwsh
      run: |
        $dll = "src/Recorder/dist/${{ matrix.config.name }}/${{ matrix.config.dll }}"
        if (-not (Test-Path $dll)) {
          throw "$dll is missing. Recorder binaries are missing from the repository."
        }
        $v = (Get-Content src/Recorder/dist/VERSION -Raw).Trim()
        "Committed recorder build: v$v" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

    - name: Check committed version matches tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}" -replace '^v', ''
        $v   = (Get-Content src/Recorder/dist/VERSION -Raw).Trim()
        if ($tag -ne $v) {
          throw "Tag '$tag' does not match committed recorder build 'v$v'. Rebuild the recorder, commit, then re-tag."
        }

    - name: Create archive (${{ matrix.config.name }})
      shell: pwsh
      run: |
        $items = @("src/Recorder/dist/${{ matrix.config.name }}/${{ matrix.config.dll }}")
        foreach ($extra in @("src/Recorder/dist/manifest.csv", "LICENSE")) {
          if (Test-Path $extra) { $items += $extra }
        }
        Compress-Archive -Path $items -DestinationPath "src/Recorder/dist/tplayx-${{ matrix.config.name }}.zip" -Force

    - name: Upload prerelease asset (${{ matrix.config.name }})
      if: github.ref == 'refs/heads/master'
      shell: pwsh
      run: |
        gh release upload latest "src/Recorder/dist/tplayx-${{ matrix.config.name }}.zip" --clobber
        if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release asset (${{ matrix.config.name }})
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        gh release upload "${{ github.ref_name }}" "src/Recorder/dist/tplayx-${{ matrix.config.name }}.zip" --clobber
        if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-assets:
    runs-on: ubuntu-latest
    needs: [build-tdraw, package-recorder]

    permissions:
      contents: read

    steps:
    - name: Confirm every expected asset is attached
      shell: bash
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="latest"; fi
        EXPECTED="tdraw-ota.zip tdraw-prota.zip tdraw-escalation.zip tdraw-tazero.zip tdraw-bta.zip \
                  tplayx-ota.zip tplayx-prota.zip tplayx-escalation.zip tplayx-twilight.zip \
                  tplayx-mayhem.zip tplayx-tazero.zip tplayx-bta.zip"
        ACTUAL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
        echo "attached to $TAG:"; echo "$ACTUAL" | sed 's/^/  /'
        MISSING=""
        for a in $EXPECTED; do
          echo "$ACTUAL" | grep -qx "$a" || MISSING="$MISSING $a"
        done
        if [ -n "$MISSING" ]; then echo "MISSING:$MISSING"; exit 1; fi
        echo "all 12 assets present"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
