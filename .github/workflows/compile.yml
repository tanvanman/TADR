name: Build and Release tdraw.dll

# Pull requests and master: build all seven configurations and check them.
# release-candidate/*: the same, run by the release automation before anything reaches master.
# v* tags: build, then publish the release with all seven zips in one step.
on:
  push:
    branches:
      - master
      - 'release-candidate/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config-table:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Contributors leave tdraw.txt alone (see CONTRIBUTING.md), so on a pull request this only
    # checks that the headers can be evaluated; releases must match exactly.
    - name: Evaluate the per-mod configuration headers
      run: python3 src/DDraw/tools/config_table.py --markdown >> "$GITHUB_STEP_SUMMARY" || ${{ github.event_name == 'pull_request' }}

    - name: Check the configurations table in tdraw.txt
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release-candidate/')
      run: python3 src/DDraw/tools/config_table.py --check

  build-tdraw:
    runs-on: windows-latest

    strategy:
      matrix:
        config:
          - name: prota
            define: TDRAW_CONFIG_PROTA
            dll: tplayx.dll
          - name: escalation
            define: TDRAW_CONFIG_ESCALATION
            dll: eplayx.dll
          - name: ota
            define: TDRAW_CONFIG_OTA
            dll: tplayx.dll
          - name: tazero
            define: TDRAW_CONFIG_TAZERO
            dll: zplayx.dll
          - name: bta
            define: TDRAW_CONFIG_BTA
            dll: bplayx.dll
          - name: mayhem
            define: TDRAW_CONFIG_MAYHEM
            dll: tplayx.dll
          - name: twilight
            define: TDRAW_CONFIG_TWILIGHT
            dll: tplayx.dll

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64_x86

    - name: Build tdraw.dll (${{ matrix.config.name }})
      run: |
        msbuild src/DDraw/ddraw.vcxproj /p:Configuration=ReleasePublic /p:Platform=x86 /p:TDRAW_CONFIG=${{ matrix.config.define }}

    # The runner's MSVC toolset drifts independently of this repo, and newer ones
    # statically import Win8+ APIs (GetSystemTimePreciseAsFileTime) that stop the
    # DLL loading at all on the Windows 7 rigs some players still use.  Check the
    # artifact rather than trusting the compiler settings.
    - name: Verify Windows 7 compatibility (${{ matrix.config.name }})
      run: |
        python src/DDraw/tools/check_win7_imports.py src/DDraw/Public/tdraw.dll

    # The recorder is Delphi 7, which GitHub runners cannot build, so its DLLs are committed
    # under dist/ and packaged from there. Same checks the standalone recorder job used.
    - name: Verify committed recorder build exists (${{ matrix.config.name }})
      shell: pwsh
      run: |
        $dll = "src/Recorder/dist/${{ matrix.config.name }}/${{ matrix.config.dll }}"
        if (-not (Test-Path $dll)) {
          throw "$dll is missing. Recorder binaries are missing from the repository."
        }
        $v = (Get-Content src/Recorder/dist/VERSION -Raw).Trim()
        "Committed recorder build: v$v (versioned independently of the tdraw tag)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

    # One zip per mod carrying both DLLs, so a user installs a matched pair instead of
    # sourcing tdraw and the recorder from two separate downloads.
    - name: Create archive (${{ matrix.config.name }})
      shell: pwsh
      run: |
        $items = @("src/DDraw/Public/tdraw.dll", "src/DDraw/totala.ini", "src/DDraw/tdraw.txt")
        $items += "src/Recorder/dist/${{ matrix.config.name }}/${{ matrix.config.dll }}"
        foreach ($extra in @("src/Recorder/dist/manifest.csv", "LICENSE")) {
          if (Test-Path $extra) { $items += $extra }
        }
        Compress-Archive -Path $items -DestinationPath "src/DDraw/Public/tdraw-${{ matrix.config.name }}.zip" -Force

    - name: Keep archive (${{ matrix.config.name }})
      uses: actions/upload-artifact@v4
      with:
        name: tdraw-${{ matrix.config.name }}
        path: src/DDraw/Public/tdraw-${{ matrix.config.name }}.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [config-table, build-tdraw]

    # The only job that can write. It runs no repository code.
    permissions:
      contents: write

    steps:
    - name: Collect the seven archives
      uses: actions/download-artifact@v4
      with:
        path: zips
        merge-multiple: true

    - name: Confirm every expected asset was built
      run: |
        for m in ota prota escalation tazero bta mayhem twilight; do
          test -s "zips/tdraw-$m.zip" || { echo "missing tdraw-$m.zip"; exit 1; }
        done

    # The release notes are the annotated tag's message. A four-part version such as
    # v2026.11.25.2 (second release of a day) is fine here; nothing parses it as semver.
    - name: Publish
      run: |
        gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object | select(.type=="tag") | .sha' > tagsha
        : > notes.md
        if [ -s tagsha ]; then
          gh api "repos/$REPO/git/tags/$(cat tagsha)" --jq .message | tail -n +3 > notes.md
        fi
        gh release create "$TAG" zips/*.zip --repo "$REPO" --verify-tag --latest --title "$TAG" --notes-file notes.md
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
